<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612"/>
      <stop offset="40%" stop-color="#080d24"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Aurora Gradients -->
    <radialGradient id="auroraCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPink" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Auroras -->
  <rect width="1200" height="630" fill="url(#auroraCyan)"/>
  <rect width="1200" height="630" fill="url(#auroraPurple)"/>
  <rect width="1200" height="630" fill="url(#auroraPink)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Central Glassmorphism Card Frame -->
  <rect x="80" y="70" width="1040" height="490" rx="28" fill="#0f172a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Brand Mark Icon Badge -->
  <g transform="translate(140, 130)">
    <rect width="64" height="64" rx="18" fill="url(#logoGrad)"/>
    <path d="M18 48 V16 h9 l14 19 V16 h8 v32 h-9 l-14 -19 v19 Z" fill="#ffffff"/>
  </g>

  <!-- Eyebrow Tag -->
  <text x="224" y="152" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00d4ff" letter-spacing="3">AI PRODUCTIVITY OPERATING SYSTEM</text>
  <text x="224" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Engineered by Rohan Mondal • Supabase Cloud PostgreSQL • Google Gemini 2.5</text>

  <!-- Main Headline -->
  <text x="140" y="275" font-family="'Space Grotesk', system-ui, sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">THE FUTURE OF AI</text>
  <text x="140" y="340" font-family="'Space Grotesk', system-ui, sans-serif" font-size="54" font-weight="800" fill="#00d4ff" letter-spacing="-1">PRODUCTIVITY IS HERE.</text>

  <!-- Description Copy -->
  <text x="140" y="395" font-family="system-ui, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400">
    All-in-one workspace unifying streaming conversational AI, multi-page website synthesis,
  </text>
  <text x="140" y="425" font-family="system-ui, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400">
    daily productivity planners, and cloud synchronization with direct Google OAuth.
  </text>

  <!-- Feature Chips at Bottom -->
  <g transform="translate(140, 470)">
    <rect x="0" y="0" width="170" height="42" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="85" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">💬 Streaming AI Chat</text>

    <rect x="185" y="0" width="185" height="42" rx="12" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="277" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌐 Website Studio (ZIP)</text>

    <rect x="385" y="0" width="165" height="42" rx="12" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="467" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">📅 Daily Focus Planner</text>

    <rect x="565" y="0" width="165" height="42" rx="12" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="647" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Supabase Postgres</text>

    <rect x="745" y="0" width="155" height="42" rx="12" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="822" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔑 Google OAuth 2.0</text>
  </g>
</svg>
