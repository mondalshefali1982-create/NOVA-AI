<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="Sign in or create your account on NOVA AI — Next-Gen AI Productivity Command Center with direct Google OAuth and cloud sync.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#060816">

  <!-- Open Graph / Social Cards -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nova-ai-rohann.vercel.app/login.html">
  <meta property="og:title" content="Sign In — NOVA AI Command Center">
  <meta property="og:description" content="Access your AI conversations, websites, and productivity workspace. Continue with Google or Email.">
  <meta property="og:image" content="https://nova-ai-rohann.vercel.app/assets/og-image.png">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign In — NOVA AI Command Center">
  <meta name="twitter:description" content="Access your AI conversations, websites, and productivity workspace. Continue with Google or Email.">
  <meta name="twitter:image" content="https://nova-ai-rohann.vercel.app/assets/og-image.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="canonical" href="https://nova-ai-rohann.vercel.app/login.html">

  <title>Sign In — NOVA AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <div class="ambient-scene" aria-hidden="true">
    <span class="aurora aurora-one"></span>
    <span class="aurora aurora-two"></span>
    <span class="aurora aurora-three"></span>
    <span class="star-field"></span>
  </div>

  <main class="auth-shell">
    <section class="auth-brand-panel">
      <a class="brand auth-brand" href="login.html" aria-label="NOVA AI login">
        <span class="brand-mark">N</span>
        <span>NOVA AI</span>
      </a>
      <div>
        <p class="eyebrow">Created by Rohan Mondal</p>
        <h1>NOVA AI</h1>
        <p class="auth-description">AI-powered productivity workspace with chat, voice assistant, cloud sync, smart memory, document generation, and more.</p>
      </div>
    </section>

    <section class="auth-card" aria-label="NOVA AI authentication">
      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button class="active" id="loginTab" type="button" role="tab" aria-selected="true">Login</button>
        <button id="signupTab" type="button" role="tab" aria-selected="false">Signup</button>
      </div>

      <button type="button" class="google-auth-btn" id="googleAuthBtn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>OR CONTINUE WITH EMAIL</span>
      </div>

      <form class="login-form" id="loginForm">
        <input type="text" name="website_trap" id="websiteTrap" style="display:none !important; position:absolute; left:-9999px; opacity:0; pointer-events:none;" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label id="nameField" hidden>
          <span>Name</span>
          <input id="authName" type="text" autocomplete="name" placeholder="Rohan Mondal">
        </label>
        <label>
          <span>Email</span>
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="Enter your password (min 6 characters)" required>
        </label>
        <button class="btn primary" id="authSubmit" type="submit">Sign In</button>
      </form>

      <p id="authMessage" class="auth-message" role="status">Use your NOVA AI account to continue.</p>
      <p class="auth-legal-footer" style="text-align:center; font-size:12px; color:#64748b; margin-top:14px;">
        By continuing, you agree to NOVA AI's <a href="terms.html" style="color:#00d4ff; text-decoration:underline;">Terms</a> and <a href="privacy.html" style="color:#00d4ff; text-decoration:underline;">Privacy Policy</a>.
      </p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="analytics.js" defer></script>
  <script src="login.js"></script>
</body>
</html>
